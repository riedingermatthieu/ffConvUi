<?xml version="1.0" encoding="UTF-8"?>
<!-- ffconv application icon: two arrows turning around a play triangle
     ("convert media"). Source for every generated size: see tools/make_icons.py -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b3bd6"/>
      <stop offset="1" stop-color="#0aa3a0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="3" refY="5"
            markerWidth="2.6" markerHeight="2.6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#shine)"/>

  <!-- two arrows on a circle of radius 78 around the centre, each spanning
       150 degrees, turning clockwise -->
  <g fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round">
    <path d="M 52.66 107.81 A 78 78 0 0 1 198.11 93.81" marker-end="url(#head)"/>
    <path d="M 203.34 148.19 A 78 78 0 0 1 57.89 162.19" marker-end="url(#head)"/>
  </g>

  <!-- play triangle, nudged right so it looks centred -->
  <path d="M 108 94 L 108 162 L 164 128 z" fill="#ffffff" stroke="#ffffff"
        stroke-width="8" stroke-linejoin="round"/>
</svg>
